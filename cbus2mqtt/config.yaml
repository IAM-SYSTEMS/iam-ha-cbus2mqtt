name: "cbus2mqtt (IAM)"
description: "IAM fork of cbus2mqtt/cmqttd with confirm-and-wait CNI send queue"
version: "0.6.1-iam"
slug: "iam_cbus2mqtt"
url: "https://github.com/IAM-SYSTEMS/iam-ha-cbus2mqtt"
startup: "application"
boot: "auto"
init: false
usb: true
uart: true
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - share:rw
options:
  mqtt_broker_address: core-mosquitto
  mqtt_user: null
  mqtt_password: null
  tcp_or_serial: "Use a IP connection to CBUS"
  cbus_connection_string: null
schema:
  mqtt_broker_address: "str?"
  mqtt_user: "str?"
  mqtt_password: "str?"
  tcp_or_serial: list(Use a IP connection to CBUS|Use a serial connection to CBUS)
  cbus_connection_string: str
  use_tls_for_mqtt: bool?
  mqtt_broker_port: int(1,99999)?
  broker_ca: str?
  broker_client_cert: str?
  broker_client_key: str?
  project_file: str?
  timesync: int(1,9999)?
  no_clock: bool?
  log_verbosity: str?
